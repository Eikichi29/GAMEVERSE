name: Build GAMESVERSE Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build application
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name GAMESVERSE --collect-all PySide6 --add-data "assets;assets" --add-data "catalogue.json;." main.py

      - name: Build installer
        shell: cmd
        run: ISCC.exe GAMESVERSE.iss

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/GAMESVERSE.exe
            installer-output/GAMESVERSE-Setup-0.5.0.exe
